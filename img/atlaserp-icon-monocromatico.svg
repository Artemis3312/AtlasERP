<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AtlasERP" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AtlasERP</title>
  <defs>
    <!-- Recorta aristas de la caja y deja un hueco alrededor de la moneda -->
    <mask id="cubo" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g stroke="#000" stroke-width="10" stroke-linecap="round" fill="none">
        <line x1="256" y1="256" x2="126" y2="181"/>
        <line x1="256" y1="256" x2="386" y2="181"/>
        <line x1="256" y1="256" x2="256" y2="406"/>
      </g>
      <circle cx="372" cy="372" r="80" fill="#000"/>
    </mask>

    <!-- Recorta la A y el aro interior de la moneda -->
    <mask id="moneda" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="372" cy="372" r="42" fill="none" stroke="#000" stroke-width="5"/>
      <path d="M352 392 L372 344 L392 392 M359 377 H385" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Caja isométrica -->
  <g fill="#222A2A" mask="url(#cubo)">
    <polygon points="256,106 386,181 256,256 126,181"/>
    <polygon points="126,181 256,256 256,406 126,331"/>
    <polygon points="386,181 256,256 256,406 386,331"/>
  </g>

  <!-- Moneda con la A de Atlas -->
  <circle cx="372" cy="372" r="64" fill="#222A2A" mask="url(#moneda)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
